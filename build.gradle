def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', '--short', 'HEAD']
            ignoreExitValue = true
        }

        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>";
        } else {
            return result.standardOutput.asText.get().strip();
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>";
    }
}

def buildtime = {System.currentTimeSeconds()}

processResources {
    def time = buildtime()
    def hash = gitCommitHash()
    def version = project.version

    inputs.properties("version": version, "commit": hash, "buildtime": time)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": version, "commit": hash, "buildtime": time
    }

    // Exclude leftover Fabric metadata from NeoForge build
    exclude 'fabric.mod.json'
    exclude 'voxy.accesswidener'
}

neoForge {
    version = project.neoforge_version

    // Validate access transformers at build time to catch invalid targets
    // Temporarily disabled to debug build issue
    // validateAccessTransformers = true

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = "2024.11.17"
    }

    runs {
        client {
            client()
            // -PrunDir=<dir> keeps a throwaway game directory apart from the everyday dev one in run/.
            if (project.hasProperty('runDir')) {
                gameDirectory = file(project.property('runDir').toString())
            }
            // ./gradlew runClient -PquickPlay="New World" boots straight into that save.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay').toString())
            }
            // -PdevShots=<script> runs a screenshot script once the world is up (me.cortex.voxy.client.dev.DevShots).
            if (project.hasProperty('devShots')) {
                systemProperty 'voxy.devShots', file(project.property('devShots').toString()).absolutePath
            }
            // -PrunJvmArgs="-Xmx3G -Dvoxy.geometryBufferSizeOverrideMB=512" for a run on a machine short of memory.
            if (project.hasProperty('runJvmArgs')) {
                jvmArguments.addAll(project.property('runJvmArgs').toString().trim().split('\\s+'))
            }
        }
    }

    mods {
        voxy {
            sourceSet sourceSets.main
        }
    }
}

