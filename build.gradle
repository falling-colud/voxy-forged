// --- Sodium 0.8 compile-time API extraction --------------------------------
// Sodium 0.8 for NeoForge ships its real classes inside a JiJ'd nested jar, so they are not on
// the compile classpath when depending on the Modrinth artifact normally. Extract that nested
// jar here so Voxy's Sodium mixins/integration can compile against it. Runtime is unaffected -
// NeoForge still loads Sodium from the JiJ bundle.
configurations {
    sodiumDist { transitive = false }
}

dependencies {
    sodiumDist "maven.modrinth:sodium:mc1.21.1-0.8.12-beta.2-neoforge"
}

def extractSodiumApi = tasks.register('extractSodiumApi', Copy) {
    from({ zipTree(configurations.sodiumDist.singleFile) }) {
        include 'META-INF/jarjar/net.caffeinemc.sodium-neoforge-*-mod.jar'
        eachFile { it.relativePath = new org.gradle.api.file.RelativePath(true, 'sodium-api.jar') }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('sodium-api')
}

dependencies {
    // To change the versions see the gradle.properties file
    implementation "net.neoforged:neoforge:${project.neoforge_version}"

    // Forgified Fabric API for compatibility (includes Fabric Loader API)
    implementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:${project.forgified_fabric_version}"

    // Sodium for NeoForge (0.8.12-beta.2 - latest for MC 1.21.1, backport of modern Sodium 0.8)
    // Provided on the runtime classpath (not as a "source" mod) so the dev run loads it like a real
    // install - Sodium 0.8's jar declares modId "sodium" both at the top level and in its JiJ'd copy,
    // which double-registers and breaks dependency resolution when added as an implementation source.
    additionalRuntimeClasspath "maven.modrinth:sodium:mc1.21.1-0.8.12-beta.2-neoforge"
    // Compile against Sodium 0.8's real classes, extracted from its JiJ bundle (see extractSodiumApi).
    compileOnly(files(layout.buildDirectory.file('sodium-api/sodium-api.jar')) { builtBy extractSodiumApi })

    // Iris shader integration (1.8.14-beta.1 - first Iris that works with the Sodium 0.8 backport).
    // implementation so the dev run loads it as a mod (Iris does not bundle into our jar - it's optional).
    implementation "maven.modrinth:iris:1.8.14-beta.1+1.21.1-neoforge"

    // Lithium for NeoForge (0.15.1 - latest for MC 1.21.1)
    implementation("maven.modrinth:lithium:mc1.21.1-0.15.1-neoforge")

    // NOTE: Voxy adds itself to Sodium's Video Settings via Sodium 0.8's native config API
    // (VoxyConfigMenu + @ConfigEntryPointForge). That page is also what Reese's Sodium Options renders,
    // so no SodiumOptionsAPI / reeses-sodium-options compile deps are needed (the old gui.options.* API
    // they expose no longer exists in Sodium 0.8).

    // Optional mod dependencies - commented out for initial port
    // TODO: Add NeoForge versions when available
    //compileOnly "drouarb:nvidium:0.4.1-beta4:1.21.6@jar"
    //compileOnly("maven.modrinth:modmenu:17.0.0-alpha.1")
    //compileOnly("maven.modrinth:iris:1.10.4+1.21.11-neoforge")
    //compileOnly("maven.modrinth:chunky:1.4.54-neoforge")
    //compileOnly("maven.modrinth:vivecraft:1.21.9-1.3.2-neoforge")
    //compileOnly("maven.modrinth:flashback:rNCr1Rbs")
}


