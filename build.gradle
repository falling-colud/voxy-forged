// ModDevGradle 2.0.42-beta pulls gradle-idea-ext 1.1.8 transitively (it uses it to generate the
// IntelliJ run configurations). 1.1.8 is Groovy-3-era and compiles a hard call to
// DefaultGroovyMethods.collect(Collection, Closure) - an overload Groovy 4 REMOVED. The Gradle 9
// wrapper this project uses bundles Groovy 4, so every IntelliJ project import blew up with
//   NoSuchMethodError: 'java.util.List ...DefaultGroovyMethods.collect(java.util.Collection, groovy.lang.Closure)'
//   at org.jetbrains.gradle.ext.JavaRunConfiguration.toMap(RunConfigurations.groovy:119)
// while `./gradlew build` from a terminal worked fine - the IDE sync is the only thing that walks
// ProjectSettings.toString(). gradle-idea-ext 1.2 dropped that call, so pin it here. Remove once
// ModDevGradle is bumped to a version that depends on 1.2 itself.
buildscript {
    configurations.classpath {
        resolutionStrategy.force 'gradle.plugin.org.jetbrains.gradle.plugin.idea-ext:gradle-idea-ext:1.2'
    }
}

plugins {
    id 'net.neoforged.moddev' version "2.0.42-beta"
    id 'maven-publish'
}

def isInGHA = System.getenv("GITHUB_ACTIONS") == "true"

// Pick a Python interpreter that actually exists on this machine. Windows ships
// `python` / `py` but not `python3`, while most *nix/CI boxes only have
// `python3` — hardcoding either one breaks the build on the other. Probe the
// candidates once at configuration time and reuse the winner.
// Returns null when there is none. Python only runs the mixin validation scripts, which are a
// development aid: someone who clones the repo to build the jar must not need Python for it.
// (A stock Windows has `python`/`python3` stubs that print a Store hint and exit non-zero, so
// "not found" has to mean "did not answer --version", not "could not be started".)
def resolveExecutable = { List<String> candidates ->
    for (String cmd : candidates) {
        try {
            def probe = new ProcessBuilder([cmd, '--version']).redirectErrorStream(true).start()
            probe.inputStream.text // drain so the process can exit
            if (probe.waitFor() == 0) return cmd
        } catch (ignored) { /* not on PATH — try the next candidate */ }
    }
    return null
}
// -PskipMixinValidation builds without the validation scripts even when Python is installed.
def pythonExe = project.hasProperty('skipMixinValidation') ? null : resolveExecutable(['python3', 'python', 'py'])
if (pythonExe == null) {
    logger.lifecycle('Mixin validation scripts skipped (no Python found, or -PskipMixinValidation). The jar builds the same.')
}

